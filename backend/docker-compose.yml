services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - utilitaria_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
      - /home/ernesto/apps/openwa/.env
    ports:
      - "127.0.0.1:8121:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - proxy
    volumes:
      - /home/ernesto/proyectos/nx-monorepo/apps/coliseo-app/coliseum-app-70cf5-firebase-adminsdk-fbsvc-098144626f.json:/run/secrets/firebase-admin.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
  monitor:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.monitor"]
    env_file:
      - .env
    depends_on:
      api:
        condition: service_started
    environment:
      ALERT_CHECK_INTERVAL_SECONDS: "300"
volumes:
  utilitaria_pgdata:
networks:
  proxy:
    external: true
