services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - utilitaria_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 1.0
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8121:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - proxy
    volumes:
      - /home/ernesto/proyectos/nx-monorepo/apps/coliseo-app/coliseum-app-70cf5-firebase-adminsdk-fbsvc-098144626f.json:/run/secrets/firebase-admin.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
      APP_VERSION: "0.9.1"
    mem_limit: 512m
    cpus: 1.0
  monitor:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.monitor"]
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    environment:
      ALERT_CHECK_INTERVAL_SECONDS: "300"
    healthcheck:
      disable: true
    mem_limit: 192m
    cpus: 0.35
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
      - /home/ernesto/apps/openwa/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - proxy
    environment:
      OUTBOX_INTERVAL_SECONDS: "5"
    healthcheck:
      disable: true
    mem_limit: 256m
    cpus: 0.5
  backup:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.backup"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - utilitaria_backups:/backups
    environment:
      BACKUP_INTERVAL_SECONDS: "86400"
      BACKUP_LOCAL_RETENTION_DAYS: "7"
    healthcheck:
      disable: true
    mem_limit: 256m
    cpus: 0.5
volumes:
  utilitaria_pgdata:
  utilitaria_backups:
networks:
  proxy:
    external: true
