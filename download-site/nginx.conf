server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location ~* \.apk$ { add_header Content-Disposition 'attachment'; add_header Cache-Control 'no-cache'; types { application/vnd.android.package-archive apk; } }
}
